name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']

# Cancel in-progress runs when a new commit lands on the same branch
# so we don't queue stale tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

# Each job below is a thin wrapper over a script under
# dev/ci/presubmits/. The same script is what `dev/tools/ci` runs
# locally, so a green local run is the same green run as remote CI.
# Keep the wiring boring — logic lives in dev/tools/, not in YAML.

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Test
        run: dev/ci/presubmits/test-unit
      - name: Build
        run: dev/ci/presubmits/build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: warn

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Format
        run: dev/ci/presubmits/verify-format
      - name: ESLint
        run: dev/ci/presubmits/lint-js
      - name: Stylelint
        run: dev/ci/presubmits/lint-css
      - name: HTMLHint
        run: dev/ci/presubmits/verify-html

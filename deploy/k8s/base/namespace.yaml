# The namespace is in base, not left to the caller's current context.
# `kubectl apply -k` against whatever namespace happens to be selected
# is how a test deployment lands in production, and kustomize's
# `namespace:` field only rewrites resources — it does not create the
# namespace it names.
apiVersion: v1
kind: Namespace
metadata:
  name: mast-web

name: Smoke

# Playwright-driven end-to-end smoke tests against the mock backend.
# Runs one browser-driven test per conformance fixture; verifies the
# SPA renders + handles events end-to-end. Separate from CI so a slow
# Playwright run (browser downloads on cache-miss) doesn't gate merge.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GO_VERSION: '1.26'

jobs:
  smoke:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install npm deps
        run: npm ci

      # Cache Playwright browsers between runs — the download is
      # ~150MB and dominates cold-cache wall time.
      - name: Get Playwright version
        id: pw
        run: echo "version=$(npm ls @playwright/test --json | node -e 'let d=JSON.parse(require("fs").readFileSync(0,"utf8"));console.log(d.dependencies["@playwright/test"].version)')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npx playwright test

      # On failure, upload the trace + screenshot for triage.
      - name: Upload trace artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: |
            playwright-report/
            test-results/
          retention-days: 7

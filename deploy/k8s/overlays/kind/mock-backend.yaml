# What sits behind the BFF in a kind cluster: mast-web-server's own
# --mode=mock, serving the attach-core conformance fixtures.
#
# This is NOT a core-agent. It replays recorded frames and keeps its
# session ACLs in a side table (cmd/mast-web-server/mock_acl.go), which
# is enough to prove that an identity authenticated at the BFF's edge
# arrives at the backend and changes what the backend answers — and
# nothing about whether a real agent accepts what we send it. The
# real-backend version of this cluster is go-steer/mast-web#66.
#
# It is the same image as the BFF. That is deliberate: the job then
# tests the artifact we ship rather than a test image built alongside
# it. The fixtures it reads are in that image for the same reason (see
# the Dockerfile's runtime stage).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mast-web-backend
  labels:
    app.kubernetes.io/name: mast-web
    app.kubernetes.io/component: mock-backend
    app.kubernetes.io/part-of: mast-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mast-web
      app.kubernetes.io/component: mock-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mast-web
        app.kubernetes.io/component: mock-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mast-web-backend
          image: ghcr.io/go-steer/mast-web:latest
          imagePullPolicy: IfNotPresent
          # Its own env rather than the BFF's ConfigMap: BACKEND_URL in
          # there would make this a proxy pointed at itself, and
          # AUTH_MODE=proxy-header is refused outside proxy mode
          # (validateAuthConfig). The mock authenticates nobody — it
          # reads the X-Asserted-Caller the BFF stamps on, exactly as a
          # real agent does.
          env:
            - name: LISTEN
              value: ':8080'
            - name: MODE
              value: 'mock'
            - name: AUTH_MODE
              value: 'none'
            # Also the image default; spelled out because a reader of
            # this file would otherwise have to guess where the mock's
            # fixtures come from.
            - name: MOCK_FIXTURES_DIR
              value: '/fixtures'
            # The fixture replay speed. Low so a session finishes inside
            # a probe interval; not zero, because zero has found frame
            # ordering bugs the SPA only hits when frames are spread out.
            - name: MOCK_FRAME_DELAY_MS
              value: '10'
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
---
# The name base's BACKEND_URL points at. A cluster with a real agent
# keeps the name and changes what answers on it.
apiVersion: v1
kind: Service
metadata:
  name: mast-web-backend
  labels:
    app.kubernetes.io/name: mast-web
    app.kubernetes.io/component: mock-backend
    app.kubernetes.io/part-of: mast-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mast-web
    app.kubernetes.io/component: mock-backend
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mast-web

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# includeSelectors is off deliberately. A selector is immutable once a
# Deployment exists, so a label that lands in one is a label that can
# never be renamed without deleting the workload. Each Deployment states
# its own selector in full; these are for humans and for kubectl -l.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: mast-web
      app.kubernetes.io/managed-by: kustomize

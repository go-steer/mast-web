<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mast-web</title>
    <!-- This document used to be the console. As of v0.4 it is a
         doormat: shell-select.js reads ?shell=, then the stored
         preference, then defaults to solo, and replaces this page with
         one of the two real entry points.

         The file keeps the name because `/` has to answer. A static
         host serving the tarball has no Go server to rewrite with, and
         a directory without an index is a listing or a 403 — neither of
         which is a console.

         Same CSP as the shells, minus what a page with no backend needs:
         no connect-src beyond 'self', no fonts, no images. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; object-src 'none'; form-action 'none'"
    />
    <script src="shell-select.js"></script>
  </head>
  <body>
    <!-- Visible only if the redirect did not happen: scripting off, or
         shell-select.js failed to load. Both shells still work when
         reached directly, so the honest fallback is to say so and point
         at them rather than to fail blank. -->
    <main
      style="
        font:
          14px ui-monospace,
          monospace;
        padding: 2rem;
        line-height: 1.6;
      "
    >
      <h1 style="font-size: 1rem">mast-web</h1>
      <p>Pick a shell:</p>
      <ul>
        <li><a href="solo.html">solo</a> — one terminal, full size</li>
        <li><a href="spatial.html">spatial</a> — a room of terminals</li>
      </ul>
    </main>
  </body>
</html>

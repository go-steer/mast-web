name: Release

# Builds the static asset bundle and attaches it as a GitHub Release
# on every `v*.*.*` tag push. The published `dist.tar.gz` archive is
# what downstream agent binaries (core-agent, later mast) consume via
# go:embed in phase C of docs/web-bootstrap.md.
#
# Manual republish (e.g. for a tag pushed before this workflow existed):
# use the workflow_dispatch entrypoint with the tag input.
#
# The release is *not* signed (no cosign yet) — mast-web ships static
# HTML/CSS/JS only, no binary attack surface, so the GitHub Release
# integrity guarantees (HTTPS + commit SHA in metadata) are adequate
# for the threat model. Revisit if assets ever start carrying
# runtime-execution implications.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0). Empty = use the current ref.'
        required: false

# Cancel superseded runs (e.g. when a tag is re-pushed during dev).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # release jobs should always finish once started

permissions:
  contents: write   # create the GitHub Release + upload assets
  packages: write   # push container image to ghcr.io

env:
  NODE_VERSION: '20'
  GO_VERSION: '1.26'
  REGISTRY: ghcr.io
  IMAGE_NAME: go-steer/mast-web

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Honor a manually-supplied tag for workflow_dispatch runs;
          # default to whatever ref triggered the workflow otherwise.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Verify CI passes on the release ref
        # Belt-and-suspenders: don't ship a tag that wouldn't pass CI.
        # The same scripts run in .github/workflows/ci.yml.
        run: dev/tools/ci

      - name: Build dist/
        run: dev/ci/presubmits/build

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # github.ref is like refs/tags/vX.Y.Z; strip the prefix.
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package dist/ as tarball
        run: |
          tag="${{ steps.tag.outputs.name }}"
          tar -czf "mast-web-${tag}.tar.gz" -C dist .
          sha256sum "mast-web-${tag}.tar.gz" > "mast-web-${tag}.tar.gz.sha256"
          ls -la mast-web-*.tar.gz*

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.name }}"
          # `gh release create` is idempotent-ish via `--target` + clobber via
          # `gh release upload --clobber`. Create-if-missing then upload.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --title "$tag" \
              --notes "mast-web $tag — static asset bundle.

              The downloadable \`mast-web-${tag}.tar.gz\` is the canonical artifact for downstream agent binaries (core-agent, mast) to fetch and embed via \`go:embed\`. SHA256 in the companion \`.sha256\` file.

              See [\`docs/web-design.md\`](https://github.com/go-steer/mast-web/blob/main/docs/web-design.md) for how the embedding works in phase C."
          fi
          gh release upload "$tag" \
            "mast-web-${tag}.tar.gz" \
            "mast-web-${tag}.tar.gz.sha256" \
            --clobber

  image:
    name: image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag name
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.name }}
            type=raw,value=latest

      - name: Build + push (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/go-steer/mast-web
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Operator-facing web UI for mast / core-agent (static SPA + optional attach proxy).
          cache-from: type=gha
          cache-to: type=gha,mode=max

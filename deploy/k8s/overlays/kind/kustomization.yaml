# The kind overlay: base, plus something for the BFF to proxy to.
#
# The whole delta is "what is behind mast-web-backend" — no patch to the
# Deployment, the Service, the probes or the auth configuration. That is
# the property the layout is for; a GKE overlay should be the same size.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Restated, not inherited: base's namespace transformer runs when base
# is built, so it does not reach resources this overlay adds. Without
# this line mast-web-backend lands in `default` and the BFF's
# BACKEND_URL resolves to nothing.
namespace: mast-web

resources:
  - ../../base
  - mock-backend.yaml

# A locally built tag, never pulled. `kind load docker-image` puts it in
# the node's image store; IfNotPresent (base) then finds it there.
images:
  - name: ghcr.io/go-steer/mast-web
    newName: mast-web
    newTag: kind

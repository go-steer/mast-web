apiVersion: v1
kind: Service
metadata:
  name: mast-web
spec:
  # ClusterIP in base. Whatever fronts this — an Ingress with IAP, a
  # Gateway, an oauth2-proxy sidecar — is the overlay's business, and it
  # is also the thing that makes AUTH_MODE=proxy-header sound. Exposing
  # this Service directly would hand every caller the identity header.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mast-web
    app.kubernetes.io/component: bff
  ports:
    - name: http
      port: 80
      # Named, not numeric: an overlay that moves the container port
      # only has to say so in one place.
      targetPort: http
